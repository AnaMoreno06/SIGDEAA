<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Login</title>
    <meta charset="UTF-8">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/logint.css}">
</head>
<body>

<div class="background-slider"></div>

<div class="login-container shadow">

    <h1 class="logo">SIGDEA</h1>
    <h2>Iniciar Sesión</h2>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Correo electrónico">
        </div>

        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Contraseña">
        </div>

        <button type="submit" class="btn-login w-100">Ingresar</button>
    </form>

    <div class="forgot-password">
        <a th:href="@{/recuperar}">¿Olvidaste tu contraseña?</a>
    </div>

    <a th:href="@{/}" class="volver">← Volver al inicio</a>

    <div th:if="${param.error}">
        <p class="error">Credenciales incorrectas</p>
    </div>

    <div th:if="${param.logout}">
        <p class="success">Sesión cerrada correctamente</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
