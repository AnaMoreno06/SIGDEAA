<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" th:href="@{/css/recuperar.css}">
</head>
<body>

<div class="contenedor">

    <h2>Recuperar contraseña</h2>

    <form th:action="@{/recuperar}" method="post">

        <input type="email"
               name="correo"
               placeholder="Ingrese su correo"
               required>

        <button type="submit">
            Enviar correo
        </button>

    </form>

</div>

</body>
</html>
